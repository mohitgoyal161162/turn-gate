[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turngate"
version = "0.1.0"
description = "Semantic end-of-turn gate for real-time voice agents: score, hold, cancel, commit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohit Goyal" }]
keywords = ["voice-ai", "turn-detection", "endpointing", "pipecat", "livekit", "conversational-ai"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["turngate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
